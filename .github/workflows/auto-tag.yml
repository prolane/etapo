name: Auto tag

# Tags merged pull requests on main and publishes a release:
#   PR labelled release:major -> next major (vX+1.0.0)
#   our PRs changing cmd/, internal/, go.mod or go.sum
#                             -> next minor (vX.Y+1.0), tagged when merged
#   Dependabot PRs            -> next patch (vX.Y.Z+1), tagged by the schedule.
#                                All untagged Dependabot PRs share one patch release.
#   Any other PR (docs, CI, e2e, Makefile) -> no release
#
# Merges made with GITHUB_TOKEN (dependabot-auto-merge.yml) do not start workflow
# runs, so Dependabot PRs are picked up by the schedule instead of the closed event.
# Every untagged PR up to the release commit counts towards the bump, so a minor
# release also ships Dependabot updates merged before it.
#
# pull_request_target runs with a write-capable token. This workflow never checks
# out or runs code from the PR; it only reads PR metadata from the API.
on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Create next version tag
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged == true && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      summary: ${{ steps.next.outputs.summary }}
    steps:
      - name: Work out the next version
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request_target ] && [ "$REF" != refs/heads/main ]; then
            echo "Run this workflow from main" >&2
            exit 1
          fi

          latest=$(gh api --paginate "repos/$REPO/tags" --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          prs=$(gh api "repos/$REPO/compare/$latest...$TARGET_SHA" --jq '.commits[].sha' \
            | while read -r sha; do
                gh api "repos/$REPO/commits/$sha/pulls" \
                  --jq '.[] | select(.merged_at != null) | [.number, .user.login, .title, ([.labels[].name] | join(","))] | @tsv'
              done)

          if [ -z "$prs" ]; then
            echo "No merged pull requests since $latest"
            exit 0
          fi

          # Only PRs that change Go code or Go dependencies count, unless labelled release:major.
          code_prs=""
          while IFS=$'\t' read -r number author title labels; do
            case ",$labels," in
              *,release:major,*) code_prs+="$number"$'\t'"$author"$'\t'"$title"$'\t'"$labels"$'\n'; continue ;;
            esac
            files=$(gh api --paginate "repos/$REPO/pulls/$number/files" --jq '.[].filename')
            if grep -Eq '^(cmd/|internal/|go\.(mod|sum)$)' <<< "$files"; then
              code_prs+="$number"$'\t'"$author"$'\t'"$title"$'\t'"$labels"$'\n'
            fi
          done <<< "$prs"

          if [ -z "$code_prs" ]; then
            echo "No merged pull requests changing Go code or dependencies since $latest"
            exit 0
          fi
          prs="$code_prs"

          bump="patch"
          while IFS=$'\t' read -r _ author _ labels; do
            case ",$labels," in
              *,release:major,*) bump=major ;;
              *) if [ "$author" != "dependabot[bot]" ] && [ "$bump" != major ]; then bump=minor; fi ;;
            esac
          done <<< "$prs"

          case $bump in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          summary=$(awk -F'\t' '{ printf "%s%s (#%s)", (NR > 1 ? "; " : ""), $3, $1 }' <<< "$prs")
          echo "Latest tag $latest, next version v$major.$minor.$patch ($bump)"
          echo "version=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag on the release commit
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.next.outputs.version }}
          SUMMARY: ${{ steps.next.outputs.summary }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api --method POST "repos/$REPO/git/tags" \
            -f tag="$VERSION" \
            -f message="Release $VERSION: $SUMMARY" \
            -f object="$TARGET_SHA" \
            -f type=commit \
            --jq '.sha')
          gh api --method POST "repos/$REPO/git/refs" \
            -f ref="refs/tags/$VERSION" \
            -f sha="$tag_sha"

  release:
    name: Build and publish release
    needs: tag
    if: needs.tag.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      RELEASE_SIGNING_KEYS: ${{ secrets.RELEASE_SIGNING_KEYS }}
