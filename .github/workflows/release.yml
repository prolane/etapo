name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true

      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Binaries and Package Archives
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -e
          mkdir -p dist/packages

          # Format: GOOS:GOARCH:GOARM:PACKAGE_BASE_NAME:BINARY_NAME
          TARGETS=(
            "linux:arm64::etapo-linux-arm64:etapo"
            "linux:arm:7:etapo-linux-armv7:etapo"
            "linux:amd64::etapo-linux-amd64:etapo"
            "darwin:arm64::etapo-darwin-arm64:etapo"
            "darwin:amd64::etapo-darwin-amd64:etapo"
            "windows:amd64::etapo-windows-amd64:etapo.exe"
          )

          for TARGET in "${TARGETS[@]}"; do
            IFS=':' read -r GOOS GOARCH GOARM PKG_NAME BIN_NAME <<< "$TARGET"
            
            BUILD_DIR="build_${PKG_NAME}"
            mkdir -p "$BUILD_DIR"

            echo "==> Building $PKG_NAME ($GOOS/$GOARCH GOARM=$GOARM)..."

            if [ -n "$GOARM" ]; then
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM go build -ldflags="-s -w -X main.version=$VERSION" -o "$BUILD_DIR/$BIN_NAME" ./cmd/etapo
            else
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w -X main.version=$VERSION" -o "$BUILD_DIR/$BIN_NAME" ./cmd/etapo
            fi

            cp config.example.yaml "$BUILD_DIR/"
            cp README.md "$BUILD_DIR/"
            cp LICENSE "$BUILD_DIR/"

            if [ "$GOOS" = "windows" ]; then
              ARCHIVE_PATH="$(pwd)/dist/packages/${PKG_NAME}-${VERSION}.zip"
              (cd "$BUILD_DIR" && zip -r "$ARCHIVE_PATH" .)
            else
              ARCHIVE_PATH="$(pwd)/dist/packages/${PKG_NAME}-${VERSION}.tar.gz"
              tar -czf "$ARCHIVE_PATH" -C "$BUILD_DIR" .
            fi

            rm -rf "$BUILD_DIR"
          done

          cd dist/packages
          sha256sum * > checksums.txt
          echo "Generated packages:"
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
